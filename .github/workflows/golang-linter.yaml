name: golang-linter
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  # required by golangci-lint-action's only-new-issues to fetch the PR patch
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  golang-linter:
    name: linter
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      # One pinned Go toolchain for linting, independent of each repo's `go`
      # directive: language semantics still come from the repo's go.mod, while
      # golangci-lint's analyzers need a toolchain at least as new as the Go
      # version they were built with. Older `go` CLIs (< 1.23) cannot drive
      # golangci-lint v2 at all, so per-repo toolchains must not be used here.
      # When adopting a new Go minor: bump go-version and the golangci-lint
      # version below TOGETHER. If a repo's go directive gets ahead of this
      # pin, golangci-lint fails fast with a clear version-mismatch error.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
      - name: Configure git for private modules
        env:
          GLOBAL_PAT: ${{ secrets.GLOBAL_PAT }}
        run: git config --global url."https://${GLOBAL_PAT}:x-oauth-basic@github.com".insteadOf "https://github.com"
      - name: Setup Go environment
        run: |
          go env -w GOPROXY=https://proxy.golang.org,direct
          go env -w GOSUMDB=sum.golang.org
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        env:
          # Keep the Go GC below the hosted runner's RAM so huge repos degrade
          # to slower GC instead of getting the runner VM OOM-killed (which
          # surfaces as "The runner has received a shutdown signal").
          GOMEMLIMIT: 5GiB
        with:
          version: v2.12.2
          github-token: ${{ github.token }}
          args: -- $(find . -type f -name "go.work" | grep . > /dev/null && go work edit -json | jq -c -r '[.Use[].DiskPath] | map_values(. + "/...")[]' || echo)
          only-new-issues: true
